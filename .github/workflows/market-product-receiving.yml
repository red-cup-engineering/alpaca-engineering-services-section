name: Receive brokerage product providers
on:
  push:
    branches: [main]
    paths:
      - "src/market-products/**"
      - "package.json"
      - "test/receiving/receive-market-products.mjs"
      - ".github/workflows/market-product-receiving.yml"
  pull_request:
    paths:
      - "src/market-products/**"
      - "package.json"
      - "test/receiving/receive-market-products.mjs"
      - ".github/workflows/market-product-receiving.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Published stable version to receive; leave empty to pack the checked-out source"
        required: false
        type: string
permissions:
  contents: read
jobs:
  ordinary-consumer:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install and receive an ordinary consumer
        env:
          PUBLISHED_ALPACA_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module <<'NODE'
          import {mkdirSync,readFileSync,writeFileSync,copyFileSync} from "node:fs";
          import {join} from "node:path";
          import {spawnSync} from "node:child_process";
          const receiving=join(process.env.RUNNER_TEMP,"alpaca-ordinary-consumer");
          const artifacts=join(process.env.RUNNER_TEMP,"alpaca-source-artifacts");
          mkdirSync(receiving,{recursive:true});
          mkdirSync(artifacts,{recursive:true});
          writeFileSync(join(receiving,"package.json"),JSON.stringify({private:true,type:"module"})+"\n");
          const manifest=JSON.parse(readFileSync("package.json","utf8"));
          const published=(process.env.PUBLISHED_ALPACA_VERSION??"").trim();
          if(published&&!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(published))throw new Error("A published stable SemVer is required");
          let target;
          if(published)target=manifest.name+"@"+published;
          else{
            const packed=spawnSync("npm",["pack","--ignore-scripts","--json","--pack-destination",artifacts],{encoding:"utf8",maxBuffer:8*1024*1024});
            if(packed.status!==0){process.stderr.write(packed.stderr??"");process.exit(packed.status??1);}
            target=join(artifacts,JSON.parse(packed.stdout)[0].filename);
          }
          const scopes=["561-group","causeway-services","coesite-operations","emsenn","emsweb","harmonious-union","koios-news","lenticule-science","red-cup-engineering","red-cup-science","rsc-quiescent","turntide-islands","union-officer-academy"];
          const install=spawnSync("npm",["install","--prefix",receiving,"--ignore-scripts","--no-audit","--no-fund","--package-lock=false","--fetch-retries=1","--fetch-timeout=30000","--registry=https://registry.561.group/",...scopes.map(scope=>"--@"+scope+":registry=https://registry.561.group/"),target],{stdio:"inherit"});
          if(install.status!==0)process.exit(install.status??1);
          // Execute outside the owning package so Node's self-reference cannot
          // select checkout source instead of the installed consumer artifact.
          const probe=join(receiving,"receive-market-products.mjs");
          copyFileSync("test/receiving/receive-market-products.mjs",probe);
          const checked=spawnSync(process.execPath,[probe],{cwd:receiving,stdio:"inherit",env:{...process.env,ALPACA_EXPECTED_VERSION:published||manifest.version}});
          process.exit(checked.status??1);
          NODE
